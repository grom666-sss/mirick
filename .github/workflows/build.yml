name: Build Windows DLL

on:
  push:
    branches:
      - arena/01a0fe3d-mirick
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32 Release
        run: cmake -S . -B build -A Win32

      - name: Build DLL
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload DLL
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MirickMenu-Win32
          path: build/Release/MirickMenu.dll
          if-no-files-found: error
