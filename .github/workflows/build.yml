name: Build Windows launcher

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag to publish after both Win32 builds pass
        required: false
        type: string

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build launcher
        run: msbuild launcher\mirick-launcher.vcxproj /m /nologo /p:Configuration=Release /p:Platform=Win32

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: mirick-launcher-Win32
          path: Release/mirick-launcher.exe
          if-no-files-found: error

  plugin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build mirick plugin
        shell: pwsh
        run: |
          msbuild mirick.sln /t:mirick /m /nologo /p:Configuration=Release /p:Platform=Win32 2>&1 | Tee-Object -FilePath msbuild.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Get-Content msbuild.log | Select-String -Pattern ': error [A-Z]+[0-9]+:' | ForEach-Object {
              $message = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
            exit $buildExit
          }

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: mirick-plugin-Win32
          path: Release/mirick.dll
          if-no-files-found: error

  release:
    # The push condition is a one-shot fallback for environments where manual
    # workflow dispatch is unavailable to the current GitHub integration.
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v1.1.8'))
    needs: [launcher, plugin]
    runs-on: windows-latest
    steps:
      - name: Download launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: mirick-launcher-Win32
          path: release

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: mirick-plugin-Win32
          path: release

      - name: Create checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Set-Content -Encoding ascii release\SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v1.1.8' }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Mirick Menu $env:RELEASE_TAG" `
            --generate-notes `
            'release\mirick.dll#mirick.dll' `
            'release\mirick-launcher.exe#mirick-launcher.exe' `
            'release\SHA256SUMS.txt#SHA256SUMS.txt'
